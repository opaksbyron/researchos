name: Verify ResearchOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build, and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Public browser configuration: both identifiers are shipped in the
      # client bundle and let CI exercise the same anonymous demo as production.
      NEXT_PUBLIC_MAIN_TENANT_KEY: "5517fcb27b1e467c941e08e9f84b63eb"
      NEXT_PUBLIC_DEFAULT_AGENT_ID: "2d5e6649-6ed2-4325-8088-8ea4e5bbe5fc"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and source-contract tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Public browser journeys
        run: pnpm test:e2e:public

      - name: Upload browser report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
